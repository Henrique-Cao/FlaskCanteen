{% extends "admin_base.html" %}
{% block content %}
<div class="dashboard-desktop-container py-4">

    <!-- Top Header & Date Filter -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
            <h2 class="fw-bold mb-1">Sales Analytics Dashboard</h2>
            <p class="text-muted small mb-0">Overview of operational revenue, kitchen prep speed, and dish sales</p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <label for="rangeFilter" class="form-label mb-0 fw-semibold text-nowrap">Date Range:</label>
            <!-- HTMX Trigger: Fetches the partial when changed, and on initial page load -->
            <select id="rangeFilter" name="range" class="form-select shadow-sm" style="max-width: 200px;"
                    hx-get="/admin/analytics/content" 
                    hx-target="#dashboard-content"
                    hx-trigger="change, load">
                <option value="today" selected>Today</option>
                <option value="7d">Last 7 Days</option>
                <option value="30d">Last 30 Days</option>
            </select>
        </div>
    </div>

    <!-- The HTMX Target Container -->
    <div id="dashboard-content">
        <!-- The partial will be injected here automatically on load -->
        <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            Loading dashboard data...
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %} 
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script src="{{ url_for('static', filename='js/pages/admin_analytics.js') }}"></script>
{% endblock %}
