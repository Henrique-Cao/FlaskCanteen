{% extends "admin_base.html" %} {% block title %}Club33 - Orders Management{%
endblock %} {% block content %}
<div class="container d-flex flex-column flex-lg-row gap-4 pt-4 flex-grow-1 overflow-hidden">

    <div id="order-queue-section" class="order-queue-section col-12 col-lg-5 p-1 d-flex flex-column h-100 ">
        <h5 class="fw-bold m-0 mb-2 text-dark">Active Orders</h5>
        <div id="order-scroll-section" class="order-scroll-section flex-grow-1 overflow-y-auto pe-2">

        </div>
    </div>
    <div class="order-details-section h-100 col-12 col-md-12 col-lg-7 pe-4 pb-4">
    </div>
</div>


<!-- The hidden blueprint for an order card -->
<template id="order-card-template">
    <!-- Notice we use your semantic tokens like bg-surface -->
    <div class="card order-card bg-surface p-3 mb-3" data-order-id="">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="order-number fw-bold text-primary m-0">#000</h4>
            <div class="d-flex flex-column align-items-center gap-1">
                <!-- <div class="order-status-badge badge badge-amber rounded-pill">Status</div> -->
                <span class="order-time text-secondary small">Just now</span>
            </div>
        </div>
        
        
        <hr class="border-subtle my-2">
        
        <div class="order-items-preview text-secondary text-truncate small">
            <!-- Items will be injected here -->
        </div>
    </div>
</template>
<!-- Blueprint for a single food item in the order -->
<template id="order-detail-item-template">
    <li class="d-flex justify-content-between mb-3 pb-3 border-bottom border-subtle">
        <div class="d-flex gap-3">
            <!-- Quantity Box -->
            <div class="bg-surface-sunken text-primary fw-bold rounded px-2 py-1 h-100 border border-subtle item-qty">
                1x
            </div>
            <!-- Item Details -->
            <div>
                <div class="fw-bold text-primary item-name">Item Name</div>
                <!-- Special requests in a muted, italic text to separate it from the main item -->
                <div class="text-secondary small mt-1 fst-italic item-notes d-none">
                    <!-- Javascript will remove d-none if there are notes -->
                </div>
            </div>
        </div>
        <!-- Price -->
        <div class="text-primary fw-bold item-price">$0.00</div>
    </li>
</template>

<!-- Blueprint for the right-side detail panel -->
<template id="order-details-shell-template">
    <div class="card d-flex flex-column h-100  p-4 ">
        
        <!-- Header: Order ID & Time -->
        <div class="d-flex justify-content-between align-items-start mb-4 pb-3 border-bottom border-subtle">
            <div>
                <h2 class="fw-bold text-primary mb-1 fs-3">Order <span class="detail-number fs-1">000</span></h2>
                <div class="text-secondary small">
                    <span class="detail-customer-name fw-bold me-2">Walk-in</span>
                    <span class="detail-customer-phone me-2"></span>
                    <span>&bull; Placed <span class="detail-time">just now</span></span>
                </div>
            </div>
            <span class="badge detail-status-badge fs-6">Pending</span>
        </div>

        <!-- Scrollable Items Container -->
        <div class="flex-grow-1 overflow-y-auto pe-2 mb-3">
            <ul class="list-unstyled m-0 detail-items-list">
                <!-- Javascript will inject the cloned <template id="order-detail-item-template"> rows here -->
            </ul>
        </div>

        <!-- Footer: Summary & Actions -->
        <div class="mt-auto pt-3 border-top border-subtle">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="text-secondary fw-bold fs-5">Total</span>
                <span class="text-primary fw-bold fs-3 detail-total-price">$0.00</span>
            </div>
            
            <!-- Dynamic Action Buttons -->
            <div class="d-flex gap-2">
                <!-- Secondary action (e.g., Print or Cancel) -->
                <button id="cancelOrderBtn" class="cancelOrderBtn btn btn-outline-secondary flex-grow-2 py-3 fw-bold detail-btn-secondary">
                    Cancel
                </button>
                <!-- Primary action (e.g., Mark Preparing, Mark Ready) -->
                <button id="markAsCompletedBtn" class=" markAsCompletedBtn btn btn-primary flex-grow-1 py-3 fw-bold fs-5 detail-btn-primary">
                    Completed Preparing
                </button>
                
                
            </div>

        </div>
    </div>
</template>
{% endblock %} {% block extra_js %}
<script type="module" src="{{ url_for('static', filename='js/pages/admin_order.js') }}"></script>
{% endblock %}
