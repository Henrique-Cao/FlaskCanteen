
<!-- 2. The Modal Inside the Loop -->
  <div class="modal fade" id="editCategoryModal-{{ category.id }}" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
          <div class="modal-content">
              <!-- Jinja constructs the exact route URL directly -->
              <form action="{{ url_for('api.categories_api.update_category', category_id=category.id) }}" method="POST">
                  <div class="modal-header">
                      <h5 class="modal-title">Edit {{ category.name }}</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  
                  <div class="modal-body">
                      <div class="mb-3">
                          <label class="form-label">Category Name</label>
                          <!-- Jinja pre-fills the input value -->
                          <input type="text" class="form-control" name="name" value="{{ category.name }}" required>
                      </div>
                  </div>
                  
                  <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                      <button type="submit" class="btn btn-primary">Save Changes</button>
                  </div>
              </form>
          </div>
      </div>
  </div>
