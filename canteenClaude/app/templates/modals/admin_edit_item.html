<div class="modal fade" id="editItemModal" tabindex="-1" aria-labelledby="editItemModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form id="editItemForm" class="modal-content border-0 shadow bg-light-custom" enctype="multipart/form-data" style="background-color: #EBE4D8;">

            <div class="modal-header border-bottom border-dark border-opacity-10 px-4">
                <h5 class="modal-title headline-font text-dark fw-bold" id="editItemModalLabel">Edit Menu Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body p-4 body-font text-dark">
                <input type="hidden" id="editItemId" name="itemId">

                <div class="mb-3">
                    <label for="editName" class="form-label label-font small text-muted text-uppercase fw-bold">Item Name</label>
                    <input type="text" class="form-control form-control-lg border-0 shadow-sm rounded-3" id="editName" name="editName" required>
                </div>

                <div class="mb-3">
                    <label for="editPrice" class="form-label label-font small text-muted text-uppercase fw-bold">Price ($)</label>
                    <input type="number" step="0.01" class="form-control form-control-lg border-0 shadow-sm rounded-3" id="editPrice" name="editPrice" required>
                </div>

                <div class="mb-3">
                    <label for="editCategory" class="form-label label-font small text-muted text-uppercase fw-bold">Category</label>
                    <select class="form-select form-select-lg border-0 shadow-sm rounded-3" id="editCategory" name="editCategory" required>
                        <option value="" disabled>Select a category...</option>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="editDescription" class="form-label label-font small text-muted text-uppercase fw-bold">Description</label>
                    <textarea class="form-control form-control-lg border-0 shadow-sm rounded-3" id="editDescription" name="editDescription" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label for="editImage" class="form-label label-font small text-muted text-uppercase fw-bold">Image</label>
                    <div class="input-group">
                        <input type="file" class="form-control form-control-lg border-0 shadow-sm rounded-3" id="editImage" name="editImage">
                        <button class="btn btn-outline-secondary" type="button" id="clearEditImageBtn" title="Clear selection">
                            <i class="bi bi-x-lg"></i>
                        </button>
                        
                    </div>
                </div>
                
                
            </div>
            
            <div class="modal-footer border-top border-dark border-opacity-10 px-4 py-3 bg-white bg-opacity-20">
                <button type="button" class="btn btn-outline-secondary label-font text-uppercase px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn text-white label-font text-uppercase px-4 fw-bold" style="background-color: #C86B53;">Save Changes</button>
            </div>

        </form>
    </div>
</div>
