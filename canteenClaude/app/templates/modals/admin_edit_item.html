<div class="modal fade" id="editItemModal" tabindex="-1" aria-labelledby="editItemModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form id="editItemForm" class="modal-content border-0 shadow bg-light-custom" style="background-color: #EBE4D8;">

            <div class="modal-header border-bottom border-dark border-opacity-10 px-4">
                <h5 class="modal-title headline-font text-dark fw-bold" id="editItemModalLabel">Edit Menu Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body p-4 body-font text-dark">
                <input type="hidden" id="edit_item_id" name="item_id">

                <div class="mb-3">
                    <label for="edit_name" class="form-label label-font small text-muted text-uppercase fw-bold">Item Name</label>
                    <input type="text" class="form-control form-control-lg border-0 shadow-sm rounded-3" id="edit_name" name="name" required>
                </div>

                <div class="mb-3">
                    <label for="edit_price" class="form-label label-font small text-muted text-uppercase fw-bold">Price ($)</label>
                    <input type="number" step="0.01" class="form-control form-control-lg border-0 shadow-sm rounded-3" id="edit_price" name="price" required>
                </div>

                <div class="mb-3">
                    <label for="edit_category" class="form-label label-font small text-muted text-uppercase fw-bold">Category</label>
                    <select class="form-select form-select-lg border-0 shadow-sm rounded-3" id="edit_category" name="category" required>
                        <option value="" disabled>Select a category...</option>
                        <option value="Main Meals">Main Meals</option>
                        <option value="Drinks">Drinks</option>
                        <option value="Sides">Sides</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="edit_description" class="form-label label-font small text-muted text-uppercase fw-bold">Description</label>
                    <textarea class="form-control form-control-lg border-0 shadow-sm rounded-3" id="edit_description" name="description" rows="3"></textarea>
                </div>
                
                
            </div>
            
            <div class="modal-footer border-top border-dark border-opacity-10 px-4 py-3 bg-white bg-opacity-20">
                <button type="button" class="btn btn-outline-secondary label-font text-uppercase px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn text-white label-font text-uppercase px-4 fw-bold" style="background-color: #C86B53;">Save Changes</button>
            </div>

        </form>
    </div>
</div>
