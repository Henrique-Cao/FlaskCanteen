<div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <!-- modal-dialog-scrollable pins .modal-header and .modal-footer, scrolling only .modal-body -->
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

            <!-- Fixed Header -->
            <div class="modal-header">
                <h2 class="modal-title fs-5 fw-bold" id="cartModalLabel">Review Your Order</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Scrollable Body -->
            <div class="modal-body">

                <!-- 1. Ordered Items (HTMX swaps ONLY this container) -->
                <div id="cart-items-list"
                     hx-get="{{ url_for('cart.cart_modal') }}"
                     hx-trigger="show.bs.modal from:#cartModal, cartUpdated from:body"
                     hx-swap="innerHTML">
                    <div class="text-center py-4">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    </div>
                </div>

                <!-- 2. Permanent Form (Never overwritten when +/- is clicked) -->
                <!-- Replace action="" with your POST checkout route, e.g. url_for('orders.checkout') -->
                <form id="checkoutForm" action="" method="POST" class="mt-4 pt-3 border-top">
                    {% if csrf_token is defined %}
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    {% endif %}

                    <!-- Customer Details -->
                    <h3 class="text-uppercase text-muted fw-semibold mb-3" style="font-size: 0.75rem; letter-spacing: 0.05em;">
                        Customer Details
                    </h3>

                    <div class="row g-3 mb-4">
                        <div class="col-12 col-sm-6">
                            <label for="customerName" class="form-label small fw-medium mb-1">
                                Name <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   id="customerName"
                                   name="customer_name"
                                   class="form-control"
                                   placeholder="Your name"
                                   required>
                        </div>

                        <div class="col-12 col-sm-6">
                            <label for="customerPhone" class="form-label small fw-medium mb-1">
                                Phone Number <span class="text-danger">*</span>
                            </label>
                            <input type="tel"
                                   id="customerPhone"
                                   name="customer_phone"
                                   class="form-control"
                                   placeholder="e.g. 9123 4567"
                                   required>
                        </div>
                    </div>

                    <!-- Kitchen Notes -->
                    <h3 class="text-uppercase text-muted fw-semibold mb-2" style="font-size: 0.75rem; letter-spacing: 0.05em;">
                        Kitchen Notes
                    </h3>

                    <div class="mb-2">
                        <label for="kitchenNotes" class="visually-hidden">Kitchen Notes</label>
                        <textarea id="kitchenNotes"
                                  name="kitchen_notes"
                                  class="form-control"
                                  rows="2"
                                  maxlength="250"
                                  placeholder="Optional: allergies, less spicy, no cutlery..."></textarea>
                    </div>
                </form>

            </div>

            <!-- Fixed Footer (Populated automatically via OOB from partials/_cart_items.html) -->
            <div id="cart-modal-footer" class="modal-footer flex-column align-items-stretch gap-3 bg-white">
            </div>

        </div>
    </div>
</div>
