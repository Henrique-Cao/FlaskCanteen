<div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true"
    >
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h2 class="modal-title fs-5" id="cartModalLabel">Your Cart</h2>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>

			<div class="modal-body"
                id="cart-modal-content"
                hx-get="{{ url_for('cart.cart_modal') }}"
                hx-trigger="show.bs.modal from:#cartModal, cartUpdated from:body">
                {% include "partials/_cart_items.html" %}
			</div>

			<div class="modal-footer">
				<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Continue shopping</button>
				{% if cart_items %}
					<a href="{{ url_for('checkout') }}" class="btn btn-primary">Checkout</a>
				{% endif %}
			</div>
		</div>
	</div>
</div>
