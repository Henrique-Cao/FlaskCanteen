<div class="modal fade" id="addItemModal" tabindex="-1" aria-labelledby="addItemModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form id="addItemForm" class="modal-content border-0 shadow" style="background-color: #EBE4D8;">
            
            <div class="modal-header border-bottom border-dark border-opacity-10 px-4">
                <h5 class="modal-title headline-font text-dark fw-bold" id="addItemModalLabel">Add New Menu Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body p-4 body-font text-dark">
                
                <div class="mb-3">
                    <label for="name" class="form-label label-font small text-muted text-uppercase fw-bold">Item Name</label>
                    <input type="text" class="form-control form-control-lg border-0 shadow-sm rounded-3" id="name" name="name" placeholder="e.g., Shepherd's Pie" required>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label label-font small text-muted text-uppercase fw-bold">Category</label>
                    <select class="form-select form-select-lg border-0 shadow-sm rounded-3" id="category" name="category" required>
                        <option value="" disabled selected>Select a category...</option>
                        <option value="Main Meals">Main Meals</option>
                        <option value="Drinks">Drinks</option>
                        <option value="Sides">Sides</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label label-font small text-muted text-uppercase fw-bold">Price ($)</label>
                    <input type="number" step="0.01" min="0" class="form-control form-control-lg border-0 shadow-sm rounded-3" id="price" name="price" placeholder="0.00" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label label-font small text-muted text-uppercase fw-bold">Description</label>
                    <textarea class="form-control form-control-lg border-0 shadow-sm rounded-3" id="description" name="description" rows="3" placeholder="Describe this rustic tavern creation..."></textarea>
                </div>
                <div class="mb-3">  
                    <label for="image_filename" class="form-label label-font small text-muted text-uppercase fw-bold">Image</label>
                    <input type="file" class="form-control form-control-lg border-0 shadow-sm rounded-3" id="image_filename" name="image">
                </div>
                

            </div>
            
            <div class="modal-footer border-top border-dark border-opacity-10 px-4 py-3 bg-white bg-opacity-20">
                <button type="button" class="btn btn-outline-secondary label-font text-uppercase px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-orange text-black label-font text-uppercase px-4 fw-bold">Add to Menu</button>
            </div>

        </form>
    </div>
</div>
