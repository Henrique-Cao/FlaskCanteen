<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Club 33 – Tavern & Canteen</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Google Fonts: Bebas Neue (display) + Barlow (body) -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet"/>

  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES (Design Tokens)
       Single source of truth for the colour palette and type scale.
       Changing a value here cascades everywhere.
    ============================================================ */
    :root {
      --gold:        #b8922a;
      --gold-light:  #d4a843;
      --cream:       #f0ebe0;
      --rust:        #a0401a;
      --dark:        #1a1a12;
      --dark-mid:    #252518;
      --card-bg:     #f5f0e8;
      --text-dark:   #1c1c14;
      --text-muted:  #7a7a6a;
      --icon-bg:     #e8e2d6;

      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Barlow', sans-serif;

      /* Fluid type: clamp(min, preferred, max) keeps text
         readable on every screen without media-query overrides */
      --fs-hero-title: clamp(3.5rem, 10vw, 7rem);
      --fs-sub:        clamp(0.65rem, 2vw, 0.85rem);
      --fs-card-title: clamp(1rem, 2.5vw, 1.15rem);
      --fs-card-body:  clamp(0.82rem, 1.8vw, 0.95rem);
      --fs-cta:        clamp(0.9rem, 2.5vw, 1.1rem);
      --fs-order-head: clamp(1.8rem, 5vw, 2.8rem);
    }

    /* ============================================================
       RESET / BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--dark);
      color: var(--cream);
      overflow-x: hidden;
    }

    /* ============================================================
       HERO SECTION
       Uses a radial gradient to create the warm spotlight effect
       visible in the screenshot (lighter centre → dark edges).
    ============================================================ */
    .hero {
      min-height: 100svh;          /* svh = "small viewport height", avoids
                                      mobile browser chrome clipping */
      background:
        radial-gradient(ellipse 70% 55% at 50% 30%,
          #3a3420 0%,
          #252518 45%,
          var(--dark) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(2.5rem, 8vw, 5rem) 1.5rem clamp(3rem, 10vw, 6rem);
      position: relative;
    }

    /* Thin gold rule above and below the logo — purely decorative */
    .hero__rule {
      width: clamp(2.5rem, 10vw, 4rem);
      height: 1px;
      background: var(--gold);
      display: block;
      margin: 0 auto 0.9rem;
    }
    .hero__rule--bottom { margin: 0.9rem auto 0; }

    /* ============================================================
       LOGO TYPOGRAPHY
       "CLUB" in white, "33" in gold — both use Bebas Neue.
       font-size is fluid so the logo scales naturally on every
       viewport without breakpoint hacks.
    ============================================================ */
    .logo {
      font-family: var(--font-display);
      font-size: var(--fs-hero-title);
      line-height: 0.9;
      letter-spacing: -0.01em;
      text-align: center;
      user-select: none;
    }
    .logo__club { color: #fff; }
    .logo__num  { color: var(--gold-light); }

    /* "TAVERN & CANTEEN" subtitle with flanking rules */
    .hero__sub {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-body);
      font-size: var(--fs-sub);
      font-weight: 600;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 1rem;
    }
    .hero__sub::before,
    .hero__sub::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
      min-width: 1.5rem;
      max-width: 3rem;
    }

    /* ============================================================
       ORDER CARD (the rounded cream panel)
       border-radius on top corners only mirrors the screenshot.
       The card slides up from below the hero viewport on mobile.
    ============================================================ */
    .order-card {
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 1.75rem 1.75rem 0 0;   /* top-rounded only */
      padding: clamp(2rem, 6vw, 3.5rem) clamp(1.25rem, 5vw, 2.5rem) 2rem;
      margin-top: auto;                      /* pushes card to bottom of hero flex column */
      width: 100%;
      max-width: 480px;                      /* caps width on desktop */
      box-shadow: 0 -8px 40px rgba(0,0,0,0.35);

      /* Entrance animation */
      animation: slideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: 0.2s;
    }

    @keyframes slideUp {
      from { transform: translateY(3rem); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    /* Heading inside the card */
    .order-card__heading {
      font-family: var(--font-display);
      font-size: var(--fs-order-head);
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }
    .order-card__heading span { color: var(--rust); }

    /* ============================================================
       FEATURE ROW (icon + text pairs)
       Uses flexbox so icons and text stay aligned on all sizes.
    ============================================================ */
    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-bottom: 2rem;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Circle icon container */
    .feature-icon {
      flex-shrink: 0;                /* never squeeze the icon */
      width: clamp(3rem, 10vw, 3.5rem);
      height: clamp(3rem, 10vw, 3.5rem);
      border-radius: 50%;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: clamp(1rem, 3vw, 1.2rem);
    }

    .feature-title {
      font-family: var(--font-body);
      font-size: var(--fs-card-title);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-dark);
      line-height: 1.2;
      margin-bottom: 0.15rem;
    }
    .feature-desc {
      font-size: var(--fs-card-body);
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ============================================================
       CTA BUTTON
       Full-width pill, dark background, white text.
       Uses padding-block so it grows/shrinks with fluid type.
    ============================================================ */
    .btn-order {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--text-dark);
      color: #fff;
      font-family: var(--font-body);
      font-size: var(--fs-cta);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border: none;
      border-radius: 3rem;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
    }
    .btn-order:hover,
    .btn-order:focus-visible {
      background: #2e2e20;
      transform: translateY(-2px);
      color: #fff;
    }
    .btn-order:active { transform: translateY(0); }

    /* Chevron icon inside button */
    .btn-order__chevron {
      font-size: 1.1em;
      transition: transform 0.25s;
    }
    .btn-order:hover .btn-order__chevron { transform: translateX(3px); }

    /* "No pre-payment required" notice */
    .order-card__note {
      text-align: center;
      font-size: clamp(0.65rem, 1.8vw, 0.75rem);
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1rem;
    }

    /* ============================================================
       LOGO ENTRANCE ANIMATION (staggered fade-in)
    ============================================================ */
    .logo, .hero__sub {
      animation: fadeDown 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .hero__sub { animation-delay: 0.12s; }

    @keyframes fadeDown {
      from { transform: translateY(-1.2rem); opacity: 0; }
      to   { transform: translateY(0);       opacity: 1; }
    }

    /* ============================================================
       RESPONSIVE: DESKTOP LAYOUT
       On wider screens the hero splits: branding left, card right.
       Bootstrap handles the grid columns; these rules handle the
       visual refinements.
    ============================================================ */
    @media (min-width: 768px) {
      .hero {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: clamp(3rem, 6vw, 6rem);
        padding: 4rem clamp(2rem, 6vw, 5rem);
        min-height: 100vh;
      }

      .hero__branding {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;   /* left-align on desktop */
        text-align: left;
      }

      /* Adjust rule + sub to align left on desktop */
      .hero__rule,
      .hero__rule--bottom { margin: 0 0 0.9rem; }
      .hero__sub { justify-content: flex-start; }
      .hero__sub::before { display: none; }   /* remove left flanking rule */

      .order-card {
        margin-top: 0;
        border-radius: 1.75rem;    /* all-round on desktop */
        flex: 0 0 420px;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      }
    }

    @media (min-width: 1100px) {
      .order-card { flex: 0 0 460px; max-width: 460px; }
    }
  </style>
</head>
<body>

<!-- ================================================================
     HERO SECTION
     On mobile: single column — branding on top, card slides up below.
     On desktop: two-column side-by-side via flexbox.
================================================================ -->
<section class="hero" aria-label="Club 33 home">

  <!-- LEFT / TOP: Branding -->
  <div class="hero__branding">
    <span class="hero__rule" aria-hidden="true"></span>

    <h1 class="logo">
      <span class="logo__club">Club </span><span class="logo__num">33</span>
    </h1>

    <p class="hero__sub">Tavern &amp; Canteen</p>

    <span class="hero__rule hero__rule--bottom" aria-hidden="true"></span>
  </div>

  <!-- RIGHT / BOTTOM: Order card -->
  <div class="order-card" role="region" aria-label="Start your order">

    <h2 class="order-card__heading">
      Order Fresh.<br>
      <span>Collect Fast.</span>
    </h2>

    <!-- Feature list — three steps explained to the customer -->
    <ul class="feature-list">

      <li class="feature-item">
        <!-- SVG fork-knife icon -->
        <div class="feature-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
            <path d="M7 2v20"/>
            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
          </svg>
        </div>
        <div>
          <p class="feature-title">Pick from Menu</p>
          <p class="feature-desc">Daily specials at your fingertips</p>
        </div>
      </li>

      <li class="feature-item">
        <!-- Chevron / quick tap icon -->
        <div class="feature-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
        <div>
          <p class="feature-title">Quick Checkout</p>
          <p class="feature-desc">Order in just two simple taps</p>
        </div>
      </li>

      <li class="feature-item">
        <!-- Chef hat icon -->
        <div class="feature-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/>
            <line x1="6" y1="17" x2="18" y2="17"/>
          </svg>
        </div>
        <div>
          <p class="feature-title">Ready on Arrival</p>
          <p class="feature-desc">Skip the queue, enjoy hot food</p>
        </div>
      </li>

    </ul>

    <!-- CTA — links to Flask /order route -->
    <a href="{{ url_for('orders.index') }}" class="btn-order">
      Start My Order
      <span class="btn-order__chevron" aria-hidden="true">›</span>
    </a>

    <p class="order-card__note">No pre-payment required</p>
  </div>

</section>

<!-- Bootstrap JS (needed for any Bootstrap components you add later) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
