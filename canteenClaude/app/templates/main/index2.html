{% extends "base.html" %}

{% block title %}The Hearthside - Home{% endblock %}

{% block content %}
<main class="container-fluid d-flex flex-column align-items-center justify-content-center text-center flex-grow-1 px-4 py-3">

    <div class="mb-4" style="max-width: 260px; width: 100%;">
        <img src="{{ url_for('static', filename='img/logo.png') }}" 
             alt="Club XXXIII Logo" 
             class="img-fluid">
    </div>

    <h1 class="font-serif text-primary fw-bold lh-sm mb-3" style="font-size: 2.2rem;">
        Welcome to<br>The Hearthside
    </h1>
    <p class="text-body mb-5" style="font-size: 1.05rem;">
        Fresh, hot meals ready when you are.
    </p>

    <a href="/menu" class="btn btn-primary btn-lg rounded-pill w-100 shadow-sm d-inline-flex align-items-center justify-content-center gap-2 py-3 text-uppercase fw-semibold" style="max-width: 320px; letter-spacing: 1.5px; font-size: 0.95rem;">
        Open Menu <i class="fa-solid fa-utensils"></i>
    </a>

</main>
{% endblock %}
