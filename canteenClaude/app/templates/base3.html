<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Club 33 – Tavern & Canteen{% endblock %}</title>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
            rel="stylesheet"
        />
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap" rel="stylesheet">
        <!-- Bootstrap 5 & Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />

        <!-- Compiled CSS -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='scss/main.css') }}"
        />
        {% block extra_css %}{% endblock %}
    </head>
    <body style="background-color: #faf7f2; color: #2d2319">
        <!-- Desktop Top Navbar -->
        <header>
            <nav class="navbar fixed-top navbar-top px-3 py-2 py-md-3 shadow-sm">
                <div class="container-fluid d-flex align-items-center justify-content-between max-width-lg">
                    <a class="navbar-brand m-0" href="{{ url_for('main.index') }}">Hearthside</a>

                    <div class="d-none d-md-flex align-items-center gap-4">
                        <a class="nav-link-desktop {{ 'active' if request.endpoint == 'main.index' }}" href="{{ url_for('main.index') }}">Home</a>
                        <a class="nav-link-desktop {{ 'active' if request.endpoint == 'main.menu' }}" href="{{ url_for('main.menu') }}">Menu</a>
                        <a class="nav-link-desktop {{ 'active' if request.endpoint == 'main.track_order' }}" href="{{ url_for('main.track_order') }}">Track Order</a>
                    </div>

                    <div class="d-flex align-items-center ms-auto ms-md-0">
                        <a href="{{ url_for('admin.index') }}" class="admin-login-link d-flex align-items-center gap-2">
                        <span class="small d-none d-md-inline">Admin Login</span>
                        <i class="bi bi-person-circle fs-5"></i>
                        </a>
                    </div>
                </div>
            </nav>
        </header>

        <!-- Main Content Wrapper (Adds offset for fixed bars) -->
        <main class="pt-4 pb-5 mt-4 mb-5">
            {% block content %}{% endblock %}
        </main>

        <!-- Mobile Bottom Navigation Bar -->
        <!-- Mobile Bottom Navigation Bar -->
        
        <nav class="navbar fixed-bottom nav-mobile-bar px-2 py-1.5 d-md-none shadow-lg">
            <div class="container-fluid d-flex justify-content-around align-items-center px-0">
                <a href="{{ url_for('main.index') }}" class="nav-tab-item {{ 'active' if request.endpoint == 'main.index' }}">
                <i class="bi bi-house-door-fill"></i>
                <span>Home</span>
                </a>
                <a href="{{ url_for('main.menu') }}" class="nav-tab-item {{ 'active' if request.endpoint == 'main.menu' }}">
                <i class="bi bi-cup-hot-fill"></i>
                <span>Menu</span>
                </a>
                <a href="{{ url_for('main.track_order') }}" class="nav-tab-item {{ 'active' if request.endpoint == 'main.track_order' }}">
                <i class="bi bi-receipt"></i>
                <span>Track Order</span>
                </a>
            </div>
        </nav>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
