<!-- 1. HTMX added to the Form tag so the "Apply Filters" button does an AJAX swap -->
<form id="filterForm" 
      hx-get="{{ url_for('admin.order_history') }}" 
      hx-target="#historyResults" 
      hx-push-url="true">
      
    <div class="dropdown">
        <!-- Dropdown Button remains exactly the same -->
        <button type="button"
                id="filterDropdownBtn"
                class="btn btn-outline-secondary dropdown-toggle position-relative" 
                data-bs-toggle="dropdown" 
                data-bs-auto-close="outside" a
                ria-expanded="false">
            ⚙ FILTER
            <span id="filterBadgeContainer">
                {% if active_filters_count > 0 %}
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        {{ active_filters_count }}
                    </span>
                {% endif %}
            </span>
        </button>

        <div class="dropdown-menu dropdown-menu-end p-4 shadow-lg border-0" style="width: 340px; border-radius: 12px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0 headline-font">Filter Orders</h6>
                <a href="{{ url_for('admin.order_history') }}" class="text-decoration-none small text-muted">Reset All</a>
            </div>
            <hr class="my-2">

            <!-- 1. Order Status Checkboxes (Using request.args.getlist) -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase text-muted">Status</label>
                <div class="d-flex flex-column gap-1">
                    {% for status_opt in ['Pending','completed', 'Cancelled'] %}
                    <div class="form-check">
                        <input class="form-check-input" 
                               type="checkbox" 
                               name="status" 
                               value="{{ status_opt }}" 
                               id="status_{{ status_opt }}"
                               {% if status_opt in request.args.getlist('status') %}checked{% endif %}>
                        <label class="form-check-label small" for="status_{{ status_opt }}">
                            {{ status_opt }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <!-- 2. Quick Date Presets (Using request.args.get) -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase text-muted">Date Preset</label>
                <!-- Notice we removed the inline hx-get from here, because the <form> now handles it -->
                <select name="date_preset" class="form-select form-select-sm">
                    <option value="">All Time</option>
                    <option value="today" {% if request.args.get('date_preset') == 'today' %}selected{% endif %}>Today</option>
                    <option value="yesterday" {% if request.args.get('date_preset') == 'yesterday' %}selected{% endif %}>Yesterday</option>
                    <option value="7days" {% if request.args.get('date_preset') == '7days' %}selected{% endif %}>Last 7 Days</option>
                    <option value="custom" {% if request.args.get('start_date') or request.args.get('end_date') %}selected{% endif %}>Custom Range...</option>
                </select>
            </div>

            <!-- Custom Date Inputs (Using request.args.get) -->
            <div id="customDateContainer" class="row g-2 mb-3 {% if not (request.args.get('start_date') or request.args.get('end_date')) %}d-none{% endif %}">
                <div class="col-6">
                    <label class="form-label micro-text text-muted">From</label>
                    <input type="date" name="start_date" class="form-control form-control-sm" value="{{ request.args.get('start_date', '') }}">
                </div>
                <div class="col-6">
                    <label class="form-label micro-text text-muted">To</label>
                    <input type="date" name="end_date" class="form-control form-control-sm" value="{{ request.args.get('end_date', '') }}">
                </div>
            </div>

            <!-- 3. Price Range (Using request.args.get) -->
            <div class="mb-3">
                <label class="form-label small fw-bold text-uppercase text-muted">Order Total ($)</label>
                <div class="d-flex align-items-center gap-2">
                    <input type="number" step="0.01" min="0" name="min_price" class="form-control form-control-sm" placeholder="Min" value="{{ request.args.get('min_price', '') }}">
                    <span class="text-muted">-</span>
                    <input type="number" step="0.01" min="0" name="max_price" class="form-control form-control-sm" placeholder="Max" value="{{ request.args.get('max_price', '') }}">
                </div>
            </div>

            <!-- Submit Button (Triggers the HTMX request on the form) -->
            <button type="submit" class="btn btn-dark btn-sm w-100 mt-2 fw-semibold">Apply Filters</button>
        </div>
    </div>
</form>
